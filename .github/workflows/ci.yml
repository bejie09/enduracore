name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Syntax-check JS files
        run: |
          node --check app.js
          node --check server.js

      - name: Validate package-lock.json
        run: node -e "JSON.parse(require('fs').readFileSync('package-lock.json', 'utf8'))"
